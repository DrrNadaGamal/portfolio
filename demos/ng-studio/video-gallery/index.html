<!doctype html>
<html lang="en"><head><meta name="robots" content="noindex,nofollow"><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Video Gallery - NG Studio Pro demo</title>
<style>body{margin:0;padding:32px 16px;font-family:-apple-system,'Segoe UI',Roboto,Arial,sans-serif;background:#f7f7fa}.wrap{max-width:1000px;margin:0 auto}</style>
<link rel="stylesheet" href="video-gallery.css">
</head><body><div class="wrap">
<div class="ngsp-vg"><ul class="ngsp-vg__grid"><li class="ngsp-vg__item" data-video="" data-title="Behind the scenes"><figure class="ngsp-vg__fig"><div class="ngsp-vg__open ngsp-vg__open--static"><img class="ngsp-vg__img" src="images/poster-video.webp" alt="Behind the scenes" loading="lazy" decoding="async"></div><span class="ngsp-vg__dur">1:24</span><figcaption class="ngsp-vg__cap">Behind the scenes</figcaption></figure></li><li class="ngsp-vg__item" data-video="" data-title="Inside the studio"><figure class="ngsp-vg__fig"><div class="ngsp-vg__open ngsp-vg__open--static"><img class="ngsp-vg__img" src="images/wide-1.webp" alt="Inside the studio" loading="lazy" decoding="async"></div><span class="ngsp-vg__dur">2:10</span><figcaption class="ngsp-vg__cap">Inside the studio</figcaption></figure></li><li class="ngsp-vg__item" data-video="" data-title="Product shoot day"><figure class="ngsp-vg__fig"><div class="ngsp-vg__open ngsp-vg__open--static"><img class="ngsp-vg__img" src="images/abs-5.webp" alt="Product shoot day" loading="lazy" decoding="async"></div><span class="ngsp-vg__dur">0:58</span><figcaption class="ngsp-vg__cap">Product shoot day</figcaption></figure></li></ul><dialog class="ngsp-vg__dialog" aria-label="Video player"><button type="button" class="ngsp-vg__btn ngsp-vg__close" aria-label="Close">×</button><button type="button" class="ngsp-vg__btn ngsp-vg__prev" aria-label="Previous">‹</button><figure class="ngsp-vg__view"><video class="ngsp-vg__video" controls="" playsinline="" preload="none"></video><figcaption class="ngsp-vg__bigcap"></figcaption></figure><button type="button" class="ngsp-vg__btn ngsp-vg__next" aria-label="Next">›</button></dialog></div>
</div><script src="video-gallery.js"></script></body></html>
